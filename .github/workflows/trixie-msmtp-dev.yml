# Note:
# https://docs.github.com/en/actions/concepts/security/workflow-dependency-lockfiles
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/en/actions/reference/workflows-and-actions/variables
name: 'trixie-msmtp-dev'
# GHCR: GitHub Container Registry

on:
  pull_request:
    paths:
      - '.github/workflows/trixie-msmtp-dev.yml'
      - '.github/workflows/prek_checks.yml'
      - 'trixie-msmtp/'
      - '!trixie/README.md'
  workflow_dispatch:

env:
  DESCRIPTION: >-
    'Creative Commons (CC) Debian 13 (trixie) with msmtp [development]'
  OCI: 'org.opencontainers.image'
  TITLE: 'CC Debian trixie with msmtp [development]'
  URL: 'https://github.com/creativecommons/containers/trixie'
  VENDOR: 'Creative Commons'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  prek_checks:
    uses: $/.github/workflows/prek_checks.yml

  build_and_push:
    needs: prek_checks
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:

      - parallel:

        # https://github.com/docker/login-action
        - name: Docker login to GitHub Container Registry (GHCR)
          uses: docker/login-action@v4.8.0
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # https://github.com/docker/metadata-action
        - name: Docker extract metadata
          id: docker_meta
          env:
            DOCKER_METADATA_ANNOTATIONS_LEVELS: index
          # docker/metadata-action v6.2.0
          uses: docker/metadata-action@v6.2.0
          with:
            annotations: |
              ${{ env.OCI }}.created={{ date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]' }}
              ${{ env.OCI }}.description=${{ env.DESCRIPTION }}
              ${{ env.OCI }}.source=${{ env.URL }}
              ${{ env.OCI }}.title=${{ env.TITLE }}
              ${{ env.OCI }}.url=${{ env.URL }}
              ${{ env.OCI }}.vendor=${{ env.VENDOR }}
            images: ghcr.io/creativecommons/trixie-msmtp-dev
            # https://specs.opencontainers.org/image-spec/annotations/
            labels: |
              ${{ env.OCI }}.created={{ date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]' }}
              ${{ env.OCI }}.description=${{ env.DESCRIPTION }}
              ${{ env.OCI }}.source=${{ env.URL }}
              ${{ env.OCI }}.title=${{ env.TITLE }}
              ${{ env.OCI }}.url=${{ env.URL }}
              ${{ env.OCI }}.vendor=${{ env.VENDOR }}
            tags: |
              type=ref,event=pr,suffix=-{{ sha }}

        # https://github.com/docker/setup-buildx-action
        - name: Docker setup Buildx
          id: docker_buildx
          uses: docker/setup-buildx-action@v4.4.1
          with:
            platforms: linux/amd64,linux/arm64

        # https://github.com/actions/checkout
        - name: GitHub checkout repository
          uses: actions/checkout@v7.0.1


      # https://github.com/docker/build-push-action
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v7.4.0
        with:
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          build-context: trixie=ghcr.io/creativecommons/trixie:latest
          builder: ${{ steps.docker_buildx.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: trixie-msmtp
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: ${{ steps.docker_buildx.outputs.platforms }}
          provenance: false
          push: true
          sbom: false
          tags: ${{ steps.docker_meta.outputs.tags }}
