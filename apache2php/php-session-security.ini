; configuration for session security php customizations
; priority=90

; PHP: Securing Session INI Settings - Manual
; https://www.php.net/manual/en/session.security.ini.php

; Whether to use strict session mode.
; Strict session mode does not accept an uninitialized session ID, and
; regenerates the session ID if the browser sends an uninitialized session ID.
; Strict mode protects applications from session fixation via a session
; adoption vulnerability. It is disabled by default for maximum compatibility,
; but enabling it is encouraged.
; https://wiki.php.net/rfc/strict_sessions
session.use_strict_mode = On

; Whether or not to add the httpOnly flag to the cookie, which makes it
; inaccessible to browser scripting languages such as JavaScript.
; https://php.net/session.cookie-httponly
session.cookie_httponly = On

; Add SameSite attribute to cookie to help mitigate Cross-Site Request Forgery
; (CSRF/XSRF)
; Current valid values are "Strict", "Lax" or "None". When using "None", make
; sure to include the quotes, as `none` is interpreted like `false` in ini
; files.
; https://tools.ietf.org/html/draft-west-first-party-cookies-07
session.cookie_samesite = Strict

; https://php.net/session.cookie-secure
session.cookie_secure = On

; Enable upload progress tracking in $_SESSION
; Default Value: On
; Development Value: On
; Production Value: On
; https://php.net/session.upload-progress.enabled
upload_progress.enabled = Off
