<VirtualHost *:80>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log remoteipcustom
    AddDefaultCharset utf-8

    Alias /apache2_error /usr/local/share/apache2/error
    <Directory /usr/local/share/apache2/error>
        # Disable .htaccess (for security and performance)
        AllowOverride None
        DirectoryIndex disabled
        Options None
        Require all granted
        # Deny access to PHP files (content should be only static files)
        <FilesMatch "[.]ph(?:p\d?|t|tml)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorDocument 403 /apache2_error/403.html
    ErrorDocument 404 /apache2_error/404.html

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride None
        Options +FollowSymLinks -Indexes
    </Directory>
</VirtualHost>

