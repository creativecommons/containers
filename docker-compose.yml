# https://docs.docker.com/compose/compose-file/
# https://docs.docker.com/compose/how-tos/dependent-images/

name: cc

services:

  # Creative Commons Apache2/PHP
  apache2php:
    build:
      additional_contexts:
        trixie-msmtp: "service:trixie-msmtp"
      context: apache2php
    # disable the entrypoint as the image is only being built locally for use
    # by other services
    entrypoint: /bin/true
    image: apache2php

  # Local development overlay
  localdev:
    build:
      additional_contexts:
        apache2php: "service:apache2php"
      context: localdev
    # command: DON'T USE - command/CMD is ignored
    env_file: .env
    ports:
      - '8001:80'

  # Creative Commons Debian 13 (trixie) with runit
  trixie:
    build:
      context: trixie
    # disable the entrypoint as the image is only being built locally for use
    # by other services
    entrypoint: /bin/true
    image: trixie

  # Creative Commons Debian 13 (trixie) with msmtp
  trixie-msmtp:
    build:
      additional_contexts:
        trixie: 'service:trixie'
      context: trixie-msmtp
    # disable the entrypoint as the image is only being built locally for use
    # by other services
    entrypoint: /bin/true
    image: trixie-msmtp

  # HTTP header mirror utility
  util-raw:
    build:
      context: util-raw
    ports:
      - '8002:8000'
