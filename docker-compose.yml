# https://docs.docker.com/compose/compose-file/
# https://docs.docker.com/compose/how-tos/dependent-images/

name: cc

services:

  # Creative Commons Debian 13 (trixie) with runit
  trixie:
    build:
      context: trixie
    # disable the entrypoint as the image is only being built locally for use
    # by other services
    entrypoint: /bin/true
    image: trixie

  # Creative Commons Debian 13 (trixie) with msmtp
  trixie-msmtp:
    build:
      additional_contexts:
        'ghcr.io/creativecommons/trixie:latest': 'service:trixie'
      context: trixie-msmtp
    # disable the entrypoint as the image is only being built locally for use
    # by other services
    entrypoint: /bin/true
    image: trixie-msmtp

  # Local development overlay
  trixie-local:
    build:
      additional_contexts:
        trixie-msmtp: "service:trixie-msmtp"
      context: trixie-local
    command: sh -c 'echo "CMD ignored? (this should NOT show up in console)"'
    env_file: .env
    image: trixie-local

  # HTTP header mirror utility
  util-raw:
    build:
      context: util-raw
    ports:
      - '8000:8000'
